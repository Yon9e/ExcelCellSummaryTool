[project]
name = "ExcelCellSummaryTool"
version = "0.1.0"
description = "Excel 单元格定向汇总 Windows 桌面工具"
requires-python = ">=3.12"
dependencies = [
  "PySide6",
  "Nuitka>=4.1.3",
  "ordered-set",
  "zstandard",
  "openpyxl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
