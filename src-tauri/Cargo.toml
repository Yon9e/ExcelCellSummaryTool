[package]
name = "excel-cell-summary-tool"
version = "0.2.3"
description = "Financial Tool 财务工具箱"
authors = ["Yon9e"]
license = "GPL-3.0-only"
repository = "https://github.com/Yon9e/ExcelCellSummaryTool"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "excel_cell_summary_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
calamine = "0.31.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.96.0"
thiserror = "2.0"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
sysinfo = "0.30"
imagesize = { version = "0.15", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"
clipboard-win = "5.4.1"
image = { version = "=0.25.5", default-features = false, features = ["png", "bmp"] }
png = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
